<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4d36"/>
      <stop offset="100%" stop-color="#112d21"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>

  <!-- Subtle glow inner circle -->
  <circle cx="256" cy="256" r="210" fill="#236940" opacity="0.25"/>

  <!-- Main Ledger Book with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Book Back / Cover -->
    <rect x="96" y="86" width="320" height="340" rx="18" fill="#236940"/>

    <!-- Book Pages (White) -->
    <rect x="140" y="98" width="264" height="316" rx="8" fill="#ffffff"/>

    <!-- Spine (Gold) -->
    <rect x="96" y="86" width="44" height="340" rx="6" fill="url(#goldGrad)"/>
    <line x1="126" y1="86" x2="126" y2="426" stroke="#fbbf24" stroke-width="2" opacity="0.6"/>

    <!-- Ribbon Bookmark -->
    <path d="M330 86 L330 220 L345 204 L360 220 L360 86 Z" fill="url(#goldGrad)"/>

    <!-- Ledger Content Emblem -->
    <rect x="180" y="140" width="180" height="74" rx="10" fill="#173b2b"/>
    <text x="270" y="190" font-family="-apple-system, system-ui, sans-serif" font-size="44" font-weight="bold" fill="#ffffff" text-anchor="middle" letter-spacing="1">Rp</text>

    <!-- Ledger Ruled Lines -->
    <rect x="180" y="244" width="180" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="180" y="278" width="180" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="180" y="312" width="130" height="8" rx="4" fill="#cbd5e1"/>
    <rect x="180" y="346" width="160" height="8" rx="4" fill="#e2e8f0"/>

    <!-- Currency Dot Accent -->
    <circle cx="340" cy="316" r="6" fill="#10b981"/>
  </g>
</svg>
